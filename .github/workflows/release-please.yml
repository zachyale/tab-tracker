name: release-please
# Releases are cut manually: Actions → release-please → Run workflow.
# Only repository admins may trigger it.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository admin
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (data.permission !== 'admin') {
              core.setFailed(`@${context.actor} has '${data.permission}' access; releases require admin.`);
            }
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
