name: tag-release
# Runs when a release PR merges into main: creates the vX.Y.Z tag and GitHub
# Release (if the tag doesn't already exist), then publishes the Docker image.
# The image is invoked via workflow_call because releases created with the
# default GITHUB_TOKEN don't emit `release published` events.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release notes: the newest section of CHANGELOG.md, if present.
          if [ -f CHANGELOG.md ]; then
            awk '/^#+ /{n++} n==1' CHANGELOG.md > /tmp/notes.md
          fi
          if [ -s /tmp/notes.md ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

  docker:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      packages: write
