services:
  tab-tracker:
    build: .
    # or, once published: image: ghcr.io/zachyale/tab-tracker:latest
    ports:
      - "3000:3000"
    volumes:
      - tab-tracker-data:/data
    environment:
      # Required in production: a long random string (e.g. `openssl rand -hex 32`)
      BETTER_AUTH_SECRET: change-me
      # The URL users reach the instance at (needed for OAuth callbacks + emails)
      BASE_URL: http://localhost:3000
      INSTANCE_NAME: Tab Tracker

      # --- optional: Google sign-in ---
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...

      # --- optional: any OIDC provider (Authentik, Keycloak, ...) ---
      # OIDC_PROVIDER_NAME: Authentik
      # OIDC_DISCOVERY_URL: https://auth.example.com/.well-known/openid-configuration
      # OIDC_CLIENT_ID: ...
      # OIDC_CLIENT_SECRET: ...

      # Lead the login page with OAuth buttons instead of email/password
      # DEFAULT_AUTH_METHOD: oauth

      # --- optional: SMTP for email verification + password resets ---
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_USER: ...
      # SMTP_PASS: ...
      # SMTP_FROM: Tab Tracker <tabs@example.com>

volumes:
  tab-tracker-data:
